<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Meeting details mockup</title>
<link rel="stylesheet" href="mock.css">
<style>
body{width:560px;height:780px}.stage{width:100%;height:100%}
.dim{position:absolute;inset:0;background:color-mix(in srgb,var(--win) 26%,transparent);backdrop-filter:none}
.card{position:absolute;left:12px;right:12px;bottom:8px;height:400px;border-radius:14px;background:var(--win);
  box-shadow:0 6px 14px rgba(0,0,0,.16),inset 0 0 0 1px color-mix(in srgb,var(--sep) 35%,transparent),0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}
.card-head{height:48px;padding:0 12px;gap:10px;flex:none}
.xbtn{width:28px;height:28px;border-radius:50%;background:var(--ctl);display:grid;place-items:center;flex:none}
.card-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;flex:1}
.rsvp{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;border-radius:6px;background:var(--ctl);color:var(--fg2);box-shadow:inset 0 0 0 1px var(--sep)}
.drow{gap:6px;font-size:12px;color:var(--fg2)}
.drow .i{width:16px;display:inline-flex;justify-content:center}
.agenda{font-size:12px;color:var(--fg2);line-height:1.45}
.agenda p{margin:6px 0 4px}
.agenda table{border-collapse:collapse;margin:4px 0 6px}
.agenda td{padding:4px 6px;border-bottom:1px solid var(--sep);white-space:nowrap}
.agenda ul{margin:2px 0 0 0;list-style:none}
.agenda li{padding-left:14px;text-indent:-10px;margin:2px 0}
.agenda a{color:#419cff;text-decoration:underline}
.scroller{position:absolute;right:3px;top:6px;width:6px;height:120px;border-radius:3px;background:color-mix(in srgb,var(--fg) 25%,transparent)}
</style>
</head><body><div class="stage" id="s"></div>
<script src="mock.js"></script>
<script>
const m = DAY_MEETINGS[3], col = C[m.p];
const card = `
<div class="dim"></div>
<div class="card">
  <div class="row card-head"><span class="xbtn">${icon('xmark', 11, 'var(--fg)', 2.8)}</span>
    <span class="col" style="gap:1px;min-width:0"><span style="font-size:13px;font-weight:600" class="nowrap">${m.t}</span>
    <span style="font-size:11px;font-weight:500" class="sec">${m.s}–${m.e}</span></span><span class="spacer"></span>${platformIcon(m.p, 13)}</div>
  <div class="divider"></div>
  <div class="card-body">
    <div class="col" style="gap:10px">
      <div class="row" style="gap:10px"><span class="join-btn" style="background:${col};padding:7px 12px;border-radius:8px;gap:5px;--jc:${col}">${icon('joinCircle', 12, '#fff')}${L('Подключиться', 'Join')}</span>
        <span class="row sec" style="gap:5px;font-size:12px">${icon('copy', 12, 'var(--fg2)')}${L('Скопировать ссылку', 'Copy join link')}</span></div>
      <div class="row" style="gap:6px">
        <span class="rsvp" style="background:${a(C.green, .15)};color:${C.green};box-shadow:inset 0 0 0 1.5px ${a(C.green, .5)}">${icon('check', 10, C.green, 3.2)}${L('Принять', 'Accept')}</span>
        <span class="rsvp">${icon('question', 10, C.orange, 2.6)}${L('Под вопросом', 'Tentative')}</span>
        <span class="rsvp">${icon('xmark', 10, C.red, 3.2)}${L('Отклонить', 'Decline')}</span></div>
    </div>
    <div class="col" style="gap:8px">
      <div class="row drow"><span class="i">${icon('clock', 12, 'var(--fg2)')}</span>${L('вторник, 6 октября', 'Tuesday, October 6')}</div>
      <div class="row drow"><span class="i">${icon('pin', 12, 'var(--fg2)')}</span>${L('Переговорная 4.12 «Байкал»', 'Meeting room 4.12 “Baikal”')}</div>
      <div class="row drow"><span class="i">${icon('person', 12, 'var(--fg2)')}</span>${m.org}</div>
      <div class="row drow" style="font-weight:500"><span class="i">${icon('people', 12, 'var(--fg2)')}</span>${L('Участники', 'Participants')} <span class="ter">12</span>${icon('chevR', 9, 'var(--fg3)', 3)}</div>
    </div>
    <div class="divider"></div>
    <div class="agenda">
      <p>${L('Цель встречи — утвердить новый сценарий онбординга перед передачей в разработку.', 'Goal: sign off the new onboarding flow before it goes to development.')}</p>
      <table>
        <tr><td>11:00</td><td>${L('Контекст и метрики воронки', 'Context and funnel metrics')}</td><td>${PEOPLE.irina}</td></tr>
        <tr><td>11:10</td><td>${L('Прототип: экраны 1–6', 'Prototype walkthrough, screens 1–6')}</td><td>${PEOPLE.kate}</td></tr>
        <tr><td>11:30</td><td>${L('Вопросы и решение', 'Questions and decision')}</td><td>${L('все', 'everyone')}</td></tr>
      </table>
      <ul>
        <li>• ${L('Макеты:', 'Mockups:')} <a>figma.com/file/onboarding-v3</a></li>
        <li>• ${L('Исследование:', 'Research notes:')} <a>wiki.company.com/ux/onboarding</a></li>
      </ul>
    </div>
    <span class="scroller"></span>
  </div>
</div>`;
document.getElementById('s').innerHTML = popover({ w: 480, h: 700, selected: m.t, overlay: card });
</script>
</body></html>
