<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Hero banner</title>
<link rel="stylesheet" href="mock.css">
<style>
body{width:1280px;height:640px}
.hero{position:relative;width:1280px;height:640px;overflow:hidden;background:#f5f5f7;color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.dark .hero{background:#000;color:#f5f5f7}
.copy{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.brand img{width:44px;height:44px}
.kicker{font-size:19px;font-weight:600;color:#6e6e73;letter-spacing:-.015em;margin:34px 0 14px}
.dark .kicker{color:#a1a1a6}
h1{font-size:64px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
h1 em{font-style:normal;color:#86868b}
.lead{font-size:21px;line-height:1.45;color:#6e6e73;margin-top:22px;max-width:30em;letter-spacing:-.01em}
.dark .lead{color:#a1a1a6}
.rail{position:absolute;left:80px;right:80px;top:44px;display:flex;align-items:center;gap:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;color:#0071e3}
.dark .rail{color:#2997ff}
.rail i{width:8px;height:8px;border-radius:50%;background:currentColor}
.rail b{flex:1;height:1px;background:rgba(0,0,0,.12)}
.dark .rail b{background:rgba(255,255,255,.16)}
.popwrap{position:absolute;right:64px;top:72px;transform:scale(.78);transform-origin:top right}
</style>
</head><body><div class="hero" id="h"></div>
<script src="mock.js"></script>
<script>
document.getElementById('h').innerHTML = `
  <div class="rail"><i></i>10:48<b></b></div>
  <div class="copy">
    <div class="brand"><img src="../../OWAWidget/Resources/AppIcon.iconset/icon_256x256@2x.png" alt="">OWA Widget</div>
    <div class="kicker">${L('Строка меню macOS · Exchange / OWA, Google, iCloud', 'macOS menu bar · Exchange / OWA, Google, iCloud')}</div>
    <h1>${L('Встреча через 12&nbsp;минут.<br><em>Ссылка уже здесь.</em>', 'Meeting in 12&nbsp;minutes.<br><em>The link is already here.</em>')}</h1>
    <div class="lead">${L('Все встречи на одном таймлайне — и звонок в Teams, Zoom или Webex одним нажатием.', 'All your meetings on one timeline — and your Teams, Zoom or Webex call one click away.')}</div>
  </div>
  <div class="popwrap">${popover({ w: 480, h: 700 })}</div>`;
</script>
</body></html>
