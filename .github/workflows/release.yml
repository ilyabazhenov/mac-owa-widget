name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve SwiftPM dependencies
        # Pre-resolve so Sparkle's binary artifact (sign_update CLI + xcframework)
        # is materialized before package_release.sh tries to use it.
        shell: bash
        run: swift package resolve

      - name: Build, sign, and package release artifacts
        id: package
        # SPARKLE_ED_PRIVATE_KEY is required: sign_update reads it from stdin
        # and produces the EdDSA signature embedded into appcast.xml.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ ! -f "RELEASE_NOTES.md" ]]; then
            echo "Missing RELEASE_NOTES.md" >&2
            exit 1
          fi

          if [[ -z "$(tr -d '[:space:]' < RELEASE_NOTES.md)" ]]; then
            echo "RELEASE_NOTES.md is empty" >&2
            exit 1
          fi

          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY secret is not set." >&2
            echo "Add it under Repo Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          OUTPUT="$(bash scripts/package_release.sh)"
          echo "${OUTPUT}"

          VERSION=""
          ARCHIVE_PATH=""
          APPCAST_PATH=""
          while IFS= read -r line; do
            case "${line}" in
              VERSION=*)
                VERSION="${line#VERSION=}"
                ;;
              ARCHIVE_PATH=*)
                ARCHIVE_PATH="${line#ARCHIVE_PATH=}"
                ;;
              APPCAST_PATH=*)
                APPCAST_PATH="${line#APPCAST_PATH=}"
                ;;
              NOTES_PATH=*)
                NOTES_PATH="${line#NOTES_PATH=}"
                ;;
            esac
          done <<< "${OUTPUT}"

          if [[ -z "${VERSION}" || -z "${ARCHIVE_PATH}" || -z "${APPCAST_PATH}" || -z "${NOTES_PATH}" ]]; then
            echo "Failed to parse release metadata from package script output" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "appcast_path=${APPCAST_PATH}" >> "${GITHUB_OUTPUT}"
          echo "notes_path=${NOTES_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          ARCHIVE_PATH="${{ steps.package.outputs.archive_path }}"
          APPCAST_PATH="${{ steps.package.outputs.appcast_path }}"
          # Single-version section extracted by package_release.sh. Do NOT use the full
          # RELEASE_NOTES.md here — it holds every version and would dump the whole
          # changelog into the release body.
          NOTES_PATH="${{ steps.package.outputs.notes_path }}"
          TAG="v${VERSION}"

          gh release view "${TAG}" >/dev/null 2>&1 && EXISTS=1 || EXISTS=0

          if [[ "${EXISTS}" -eq 1 ]]; then
            echo "Release ${TAG} already exists, uploading/updating artifacts"
            gh release edit "${TAG}" --notes-file "${NOTES_PATH}"
            # --clobber so re-runs overwrite both the zip and the appcast.
            gh release upload "${TAG}" "${ARCHIVE_PATH}" "${APPCAST_PATH}" --clobber
          else
            # appcast.xml ships as a release asset so that
            # https://github.com/<owner>/<repo>/releases/latest/download/appcast.xml
            # always resolves to the latest release's feed.
            gh release create "${TAG}" "${ARCHIVE_PATH}" "${APPCAST_PATH}" \
              --title "${TAG}" \
              --notes-file "${NOTES_PATH}"
          fi
